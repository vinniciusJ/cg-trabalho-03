<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>O Resgate do Gato Mago - O Despertar do Sonho</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <script>
      // Componente para interação VR via trigger dos controles Meta Quest 2
      AFRAME.registerComponent("vr-interactor", {
        init: function () {
          const el = this.el;

          el.addEventListener("triggerdown", () => {
            const raycasterComp = el.components["raycaster"];
            if (!raycasterComp) return;

            const intersections = raycasterComp.intersections;
            if (!intersections || intersections.length === 0) return;

            const target = intersections[0].object.el;
            if (!target || !target.classList.contains("clickable")) return;

            // Dispara evento de click no elemento
            target.emit("click", {}, true);

            // Chama funções inline (pickUp / catchWisp)
            const onclickAttr = target.getAttribute("onclick");
            if (onclickAttr) {
              if (onclickAttr.includes("pickUp")) pickUp(target);
              else if (onclickAttr.includes("catchWisp")) catchWisp(target);
            }
          });
        },
      });

      AFRAME.registerComponent("game-logic", {
        init: function () {
          this.isHoldingItem = false;
          this.heldItem = null;
          this.shieldDown = false;
          this.potionState = 0;
          this.gameOver = false;
          this.wispsCaught = 0;

          const instructions = document.querySelector("#hud-text");
          const hudBg = document.querySelector("#hud-bg");
          const scene = document.querySelector("a-scene");
          const restartBtn = document.querySelector("#restart-ui");

          const itemLore = {
            "potion-green": "o Suspiro da Floresta",
            "potion-pink": "o Orvalho das Memorias",
            "potion-blue": "a Essencia do Firmamento",
          };

          const resetHUD = () => {
            hudBg.setAttribute("height", "0.25");
            instructions.setAttribute("wrap-count", "40");
          };

          scene.setAttribute("fog", "density: 0.01; color: #12042b");
          document
            .querySelector("#main-light")
            .setAttribute("intensity", "1.2");
          document
            .querySelector("#ambient-light")
            .setAttribute("intensity", "0.4");

          document.querySelectorAll(".wisp").forEach((wisp) => {
            wisp.setAttribute("visible", "true");
            wisp.classList.add("clickable");
          });

          instructions.setAttribute(
            "value",
            "Capture as 3 Sombras Errantes para quebrar o escudo da prisao do gatinho!",
          );

          window.pickUp = (el) => {
            if (this.isHoldingItem || this.gameOver) return;
            resetHUD();
            this.isHoldingItem = true;
            this.heldItem = el;
            el.setAttribute("position", "0.3 -0.4 -0.8");
            document.querySelector("#player-camera").appendChild(el);

            const name = itemLore[el.id] || "este fragmento";
            instructions.setAttribute("value", "Voce pegou " + name + "...");
          };

          window.catchWisp = (el) => {
            if (this.gameOver) return;
            el.setAttribute("visible", "false");
            el.classList.remove("clickable");
            if (el.parentNode) el.parentNode.setAttribute("visible", "false");
            this.wispsCaught++;

            if (this.wispsCaught < 3) {
              instructions.setAttribute(
                "value",
                `Voce capturou uma sombra! Faltam ${3 - this.wispsCaught}.`,
              );
            } else {
              this.shieldDown = true;
              document
                .querySelector("#shield")
                .setAttribute("visible", "false");
              document
                .querySelector("#energy-crystal")
                .setAttribute(
                  "animation",
                  "property: scale; to: 0 0 0; dur: 500",
                );
              instructions.setAttribute(
                "value",
                "O escudo da prisao do gatinho explodiu! Rapido, va ao caldeirao!",
              );
            }
          };

          restartBtn.addEventListener("click", () => {
            if (this.gameOver) window.location.reload();
          });

          document.querySelector("#cauldron").addEventListener("click", () => {
            if (this.gameOver || !this.shieldDown || !this.isHoldingItem)
              return;

            const heldId = this.heldItem.id;
            let correct = false;

            if (heldId === "potion-green" && this.potionState === 0) {
              this.potionState = 1;
              correct = true;
            } else if (heldId === "potion-pink" && this.potionState === 1) {
              this.potionState = 2;
              correct = true;
            } else if (heldId === "potion-blue" && this.potionState === 2) {
              this.potionState = 3;
              correct = true;
            }

            if (correct) {
              resetHUD();
              this.heldItem.setAttribute("visible", "false");
              this.isHoldingItem = false;
              this.heldItem = null;

              if (this.potionState === 3) {
                instructions.setAttribute(
                  "value",
                  "O Elixir esta vibrando! O Gato Mago esta acordando!",
                );
              } else {
                instructions.setAttribute(
                  "value",
                  "A essencia foi absorvida pelo caldeirao...",
                );
              }
            } else if (heldId.includes("potion")) {
              this.gameOver = true;
              hudBg.setAttribute("height", "0.3");
              instructions.setAttribute(
                "value",
                "O Sonho colapsou! A ordem estava errada.",
              );
              instructions.setAttribute("color", "#ff4444");
              restartBtn.setAttribute("visible", "true");
              restartBtn.setAttribute("scale", "1 1 1");
              restartBtn.classList.add("clickable");
            }

            if (this.potionState === 3 && !this.isHoldingItem) {
              document
                .querySelector("#cage")
                .setAttribute(
                  "animation",
                  "property: position; to: 0 20 0; dur: 4000; easing: easeInBack",
                );
              instructions.setAttribute(
                "value",
                "O GATO MAGO DESPERTOU! Voce o salvou!",
              );
            }
          });
        },
      });
    </script>
  </head>
  <body>
    <a-scene
      game-logic
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
      fog="type: exponential; color: #000; density: 0.15"
    >
      <a-assets>
        <a-asset-item id="cat-model" src="wizard_cat.glb"></a-asset-item>
        <a-asset-item id="cage-model" src="cage.glb"></a-asset-item>
        <a-asset-item id="cauldron-model" src="cauldron.glb"></a-asset-item>
        <a-asset-item id="table-model" src="table.glb"></a-asset-item>
        <a-asset-item
          id="rune-stone-model"
          src="ancient_rune_stone.glb"
        ></a-asset-item>
        <a-asset-item id="p-green" src="green-potion.glb"></a-asset-item>
        <a-asset-item id="p-pink" src="pink-potion.glb"></a-asset-item>
        <a-asset-item id="p-blue" src="blue-potion.glb"></a-asset-item>
      </a-assets>

      <a-entity
        environment="preset: dream; dressingAmount: 0; ground: flat; lighting: none;"
      ></a-entity>

      <a-light
        id="main-light"
        type="point"
        intensity="1.2"
        position="0 10 -10"
        color="#ffb6c1"
      ></a-light>
      <a-light id="ambient-light" type="ambient" intensity="0.4"></a-light>

      <a-entity id="wisp-container">
        <!-- Wisp 1 -->
        <a-entity
          position="5 3 -18"
          animation="property: position; from: 5 3 -18; to: -5 3 -18; dur: 3000; dir: alternate; loop: true"
        >
          <a-sphere
            class="wisp"
            radius="0.3"
            color="#000"
            material="emissive: #555"
            visible="false"
            onclick="catchWisp(this)"
            animation="property: position; from: 0 0 0; to: 0 3 0; dur: 1500; dir: alternate; loop: true"
          ></a-sphere>
        </a-entity>

        <!-- Wisp 2 -->
        <a-entity
          position="-8 2 -18"
          animation="property: position; from: -8 2 -18; to: 8 2 -18; dur: 4000; dir: alternate; loop: true"
        >
          <a-sphere
            class="wisp"
            radius="0.3"
            color="#000"
            material="emissive: #555"
            visible="false"
            onclick="catchWisp(this)"
            animation="property: position; from: 0 0 0; to: 0 3 0; dur: 2000; dir: alternate; loop: true"
          ></a-sphere>
        </a-entity>

        <!-- Wisp 3 -->
        <a-entity
          position="0 4 -18"
          animation="property: position; from: 0 4 -18; to: 6 4 -18; dur: 5000; dir: alternate; loop: true"
        >
          <a-sphere
            class="wisp"
            radius="0.3"
            color="#000"
            material="emissive: #555"
            visible="false"
            onclick="catchWisp(this)"
            animation="property: position; from: 0 0 0; to: 0 -3 0; dur: 2500; dir: alternate; loop: true"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity id="final-area" position="0 0 -25">
        <a-entity
          gltf-model="#table-model"
          position="-2 0 0"
          scale="0.15 0.15 0.15"
        >
          <a-entity
            id="potion-green"
            class="clickable"
            gltf-model="#p-green"
            position="-3 5 0"
            scale="3 3 3"
            onclick="pickUp(this)"
          ></a-entity>
          <a-entity
            id="potion-pink"
            class="clickable"
            gltf-model="#p-pink"
            position="0 6 0"
            scale="2 2 2"
            onclick="pickUp(this)"
          ></a-entity>
          <a-entity
            id="potion-blue"
            class="clickable"
            gltf-model="#p-blue"
            position="3 5 0"
            scale="0.2 0.2 0.2"
            onclick="pickUp(this)"
          ></a-entity>
        </a-entity>

        <a-entity
          id="cauldron"
          class="clickable"
          gltf-model="#cauldron-model"
          position="1 0 0"
          scale="0.2 0.2 0.2"
        ></a-entity>

        <a-entity id="cat-jail-setup" position="8 0 -2">
          <a-entity
            id="rune-stone"
            gltf-model="#rune-stone-model"
            scale="3 3 3"
          ></a-entity>
          <a-entity
            id="cat"
            gltf-model="#cat-model"
            position="0 1 0"
            scale="0.3 0.3 0.3"
          ></a-entity>
          <a-entity
            id="cage"
            gltf-model="#cage-model"
            position="0 1 0"
            scale="1.2 1.2 1.2"
          ></a-entity>
          <a-sphere
            id="shield"
            radius="3.2"
            color="#ff00ff"
            material="opacity: 0.15; transparent: true"
          ></a-sphere>
        </a-entity>

        <a-entity id="energy-crystal" class="clickable" position="15 1.5 -2">
          <a-octahedron
            radius="0.7"
            color="#00ffff"
            opacity="0.8"
          ></a-octahedron>
        </a-entity>
      </a-entity>

      <!-- Rig: mantém posição em modo VR e desktop. Câmera e controles são filhos. -->
      <a-entity id="rig" position="0 0 -10">
        <!-- Câmera -->
        <a-entity
          id="player-camera"
          camera
          look-controls
          wasd-controls
          position="0 1.6 0"
        >
          <a-cursor color="#fff"></a-cursor>
          <a-entity position="0 0.8 -1.2">
            <a-plane
              id="hud-bg"
              width="1.4"
              height="0.25"
              color="#1a0033"
              opacity="0.9"
            ></a-plane>
            <a-text
              id="hud-text"
              value="Capture as 3 Sombras Errantes para quebrar o escudo da prisao do gatinho!"
              align="center"
              width="1.3"
              color="#d1b2ff"
              position="0 0 0.01"
            ></a-text>
          </a-entity>
          <a-entity
            id="restart-ui"
            position="0 0 -1.5"
            visible="false"
            scale="0 0 0"
          >
            <a-plane width="0.8" height="0.25" color="#aa0000"></a-plane>
            <a-text
              value="RECORDE O SONHO"
              align="center"
              width="2"
              color="white"
              position="0 0 0.02"
            ></a-text>
          </a-entity>
        </a-entity>

        <!-- Controle direito Meta Quest 2: raycaster visual + trigger para interação -->
        <a-entity
          id="right-controller"
          oculus-touch-controls="hand: right"
          raycaster="objects: .clickable; showLine: true; lineColor: #d1b2ff; lineOpacity: 0.6; far: 30"
          vr-interactor
        ></a-entity>

        <!-- Controle esquerdo Meta Quest 2 -->
        <a-entity
          id="left-controller"
          oculus-touch-controls="hand: left"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
