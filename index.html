<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>O Resgate do Gato Mago - O Despertar do Sonho</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <script>
      AFRAME.registerComponent("vr-interactor", {
        init: function () {
          const el = this.el;
          el.addEventListener("triggerdown", () => {
            const raycasterComp = el.components["raycaster"];
            if (!raycasterComp) return;
            const intersections = raycasterComp.intersections;
            if (!intersections || intersections.length === 0) return;
            const target = intersections[0].object.el;
            if (!target || !target.classList.contains("clickable")) return;
            target.emit("click", {}, true);
          });
        },
      });

      AFRAME.registerComponent("game-logic", {
        init: function () {
          this.isHoldingItem = false;
          this.heldItem = null;
          this.shieldDown = false;
          this.potionState = 0;
          this.gameOver = false;
          this.wispsCaught = 0;

          const instructions = document.querySelector("#hud-text");
          const hudBg = document.querySelector("#hud-bg");
          const restartBtn = document.querySelector("#restart-ui");
          const playBtn = document.querySelector("#play-ui");
          const rig = document.querySelector("#rig");

          const itemLore = {
            "potion-green": "o Suspiro da Floresta",
            "potion-pink": "o Orvalho das Memorias",
            "potion-blue": "a Essencia do Firmamento",
          };

          document.querySelector("#lizard").addEventListener("click", () => {
            instructions.setAttribute("value", "Bem-vindo! Abra o Diario Mistico ao meu lado para entender o ritual.");
          });

          document.querySelector("#magic-tome").addEventListener("click", () => {
            hudBg.setAttribute("height", "0.5");
            instructions.setAttribute("wrap-count", "45");
            instructions.setAttribute("value", "O Gato Mago foi preso! Capture as 3 sombras errantes para quebrar o escudo e depois prepare a pocao no caldeirao para liberta-lo.\n\n(Clique em INICIAR abaixo)");
            playBtn.setAttribute("visible", "true");
            playBtn.setAttribute("scale", "1 1 1");
          });

          playBtn.addEventListener("click", () => {
            rig.setAttribute("animation", "property: position; to: 0 0 -10; dur: 1500; easing: easeInOutQuad");
            playBtn.setAttribute("visible", "false");
            playBtn.setAttribute("scale", "0.001 0.001 0.001");
            hudBg.setAttribute("height", "0.25");
            instructions.setAttribute("wrap-count", "40");
            instructions.setAttribute("value", "Capture as 3 Sombras Errantes!");
          });

          window.pickUp = (el) => {
            if (this.isHoldingItem || this.gameOver) return;
            this.isHoldingItem = true;
            this.heldItem = el;
            el.setAttribute("position", "0.3 -0.4 -0.8");
            el.setAttribute("scale", "0.1 0.1 0.1");
            document.querySelector("#player-camera").appendChild(el);
            instructions.setAttribute("value", "Voce pegou " + (itemLore[el.id] || "o item") + ".");
          };

          window.catchWisp = (el) => {
            if (this.gameOver || el.getAttribute('data-caught')) return;
            el.setAttribute('data-caught', 'true');
            el.setAttribute("visible", "false");
            el.classList.remove("clickable");
            this.wispsCaught++;

            if (this.wispsCaught < 3) {
              instructions.setAttribute("value", `Sombra capturada! Faltam ${3 - this.wispsCaught}.`);
            } else {
              this.shieldDown = true;
              document.querySelector("#shield").setAttribute("visible", "false");
              rig.setAttribute("animation", "property: position; to: 0 0 -21; dur: 1500; easing: easeInOutQuad");
              instructions.setAttribute("value", "Escudo quebrado! Siga para o altar.");
            }
          };

          restartBtn.addEventListener("click", () => {
            if (this.gameOver) window.location.reload();
          });

          document.querySelector("#cauldron").addEventListener("click", () => {
            if (this.gameOver || !this.shieldDown || !this.isHoldingItem) return;
            const heldId = this.heldItem.id;
            let correct = false;

            if (heldId === "potion-green" && this.potionState === 0) { this.potionState = 1; correct = true; } 
            else if (heldId === "potion-pink" && this.potionState === 1) { this.potionState = 2; correct = true; } 
            else if (heldId === "potion-blue" && this.potionState === 2) { this.potionState = 3; correct = true; }

            if (correct) {
              this.heldItem.setAttribute("visible", "false");
              this.isHoldingItem = false;
              this.heldItem = null;
              instructions.setAttribute("value", this.potionState === 3 ? "O Gato Mago esta acordando!" : "Essencia aceita...");
            } else if (heldId.includes("potion")) {
              this.gameOver = true;
              instructions.setAttribute("value", "Ordem errada! O sonho colapsou.");
              instructions.setAttribute("color", "#ff4444");
              restartBtn.setAttribute("visible", "true");
              restartBtn.setAttribute("scale", "1 1 1");
              restartBtn.classList.add("clickable");
            }

            if (this.potionState === 3 && !this.isHoldingItem) {
              document.querySelector("#cage").setAttribute("animation", "property: position; to: 1.5 20 -2; dur: 4000; easing: easeInBack");
              instructions.setAttribute("value", "O GATO MAGO DESPERTOU!");
            }
          });
        },
      });
    </script>
  </head>
  <body>
    <a-scene game-logic cursor="rayOrigin: mouse" raycaster="objects: .clickable" fog="type: exponential; color: #000; density: 0.06">
      <a-assets>
        <a-asset-item id="lizard-model" src="lizard_wizard.glb"></a-asset-item>
        <a-asset-item id="tome-model" src="magic_tome.glb"></a-asset-item>
        <a-asset-item id="cat-model" src="wizard_cat.glb"></a-asset-item>
        <a-asset-item id="cage-model" src="cage.glb"></a-asset-item>
        <a-asset-item id="cauldron-model" src="cauldron.glb"></a-asset-item>
        <a-asset-item id="table-model" src="table.glb"></a-asset-item>
        <a-asset-item id="rune-stone-model" src="ancient_rune_stone.glb"></a-asset-item>
        <a-asset-item id="p-green" src="green-potion.glb"></a-asset-item>
        <a-asset-item id="p-pink" src="pink-potion.glb"></a-asset-item>
        <a-asset-item id="p-blue" src="blue-potion.glb"></a-asset-item>
      </a-assets>

      <a-entity environment="preset: dream; dressingAmount: 0; ground: flat; lighting: none;"></a-entity>
      <a-light type="point" intensity="1.2" position="0 10 -10" color="#ffb6c1"></a-light>
      <a-light type="ambient" intensity="0.4"></a-light>

      <a-entity id="lizard" class="clickable" gltf-model="#lizard-model" position="1.2 0 2" scale="0.2 0.2 0.2" rotation="0 -40 0"></a-entity>
      <a-entity id="magic-tome" class="clickable" gltf-model="#tome-model" position="-1.2 0.6 2" scale="0.3 0.3 0.3" rotation="0 40 0"></a-entity>

      <a-entity id="wisp-container">
        <a-entity position="5 3 -22" animation="property: position; to: -5 5 -22; dur: 3000; dir: alternate; loop: true">
          <a-sphere class="wisp clickable" radius="0.5" color="#111" material="emissive: #4b0082; emissiveIntensity: 2" onclick="catchWisp(this)"></a-sphere>
        </a-entity>
        <a-entity position="-8 2 -20" animation="property: position; to: 8 4 -20; dur: 4000; dir: alternate; loop: true">
          <a-sphere class="wisp clickable" radius="0.5" color="#111" material="emissive: #00ffff; emissiveIntensity: 2" onclick="catchWisp(this)"></a-sphere>
        </a-entity>
        <a-entity position="0 6 -24" animation="property: position; to: 0 1 -24; dur: 5000; dir: alternate; loop: true">
          <a-sphere class="wisp clickable" radius="0.5" color="#111" material="emissive: #ff00ff; emissiveIntensity: 2" onclick="catchWisp(this)"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity id="final-area" position="0 0 -25">
        <a-entity gltf-model="#table-model" position="-1.5 0 0" scale="0.15 0.15 0.15">
          <a-entity id="potion-green" class="clickable" gltf-model="#p-green" position="-3 5 0" scale="3 3 3" onclick="pickUp(this)"></a-entity>
          <a-entity id="potion-pink" class="clickable" gltf-model="#p-pink" position="0 6 0" scale="2 2 2" onclick="pickUp(this)"></a-entity>
          <a-entity id="potion-blue" class="clickable" gltf-model="#p-blue" position="3 5 0" scale="0.2 0.2 0.2" onclick="pickUp(this)"></a-entity>
        </a-entity>
        <a-entity id="cauldron" class="clickable" gltf-model="#cauldron-model" position="0 0.1 0" scale="0.2 0.2 0.2"></a-entity>
        <a-entity id="cat-jail-setup" position="1.5 0 -2">
          <a-entity gltf-model="#rune-stone-model" scale="3 3 3"></a-entity>
          <a-entity id="cat" gltf-model="#cat-model" position="0 1 0" scale="0.3 0.3 0.3"></a-entity>
          <a-entity id="cage" gltf-model="#cage-model" position="0 1 0" scale="1.2 1.2 1.2"></a-entity>
          <a-sphere id="shield" radius="3.2" color="#ff00ff" material="opacity: 0.15; transparent: true"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity id="rig" position="0 0 6">
        <a-entity id="player-camera" camera look-controls wasd-controls position="0 1.6 0">
          <a-cursor color="#fff"></a-cursor>
          <a-entity position="0 0.8 -1.2">
            <a-plane id="hud-bg" width="1.4" height="0.25" color="#1a0033" opacity="0.9"></a-plane>
            <a-text id="hud-text" font="dejavu" value="Clique no Mago para comecar..." align="center" width="1.3" color="#d1b2ff" position="0 0 0.05"></a-text>
          </a-entity>

          <a-entity position="0 -0.2 -1.1">
            <a-plane id="play-ui" class="clickable" width="0.6" height="0.2" color="#2ecc71" visible="false" scale="0.001 0.001 0.001">
              <a-text font="dejavu" value="INICIAR" align="center" width="2" color="white" position="0 0 0.05"></a-text>
            </a-plane>
          </a-entity>

          <a-entity id="restart-ui" position="0 0 -1.5" visible="false" scale="0.001 0.001 0.001">
            <a-plane width="0.8" height="0.25" color="#aa0000"></a-plane>
            <a-text font="dejavu" value="RECORDE O SONHO" align="center" width="2" color="white" position="0 0 0.05"></a-text>
          </a-entity>
        </a-entity>

        <a-entity oculus-touch-controls="hand: right" raycaster="objects: .clickable; showLine: true; far: 40" vr-interactor></a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
